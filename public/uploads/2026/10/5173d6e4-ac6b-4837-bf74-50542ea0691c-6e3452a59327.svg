<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1067" role="img" aria-labelledby="title desc">
  <title id="title">安静的阅读角落</title>
  <desc id="desc">深绿色墙面、扶手椅、落地灯和摊开的书。</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#466257"/>
      <stop offset="100%" stop-color="#2d443d"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a7653"/>
      <stop offset="100%" stop-color="#6a4d37"/>
    </linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".2" r=".8">
      <stop offset="0%" stop-color="#ffe0a6" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#d4a15f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c97f55"/>
      <stop offset="100%" stop-color="#8f4d33"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .055"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="1067" fill="url(#wall)"/>
  <rect y="806" width="1600" height="261" fill="url(#floor)"/>
