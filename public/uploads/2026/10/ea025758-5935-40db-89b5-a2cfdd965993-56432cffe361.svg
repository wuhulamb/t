<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1067" role="img" aria-labelledby="title desc">
  <title id="title">从旧街走到河边</title>
  <desc id="desc">傍晚的城市剪影、街道与远处的河面。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c4657"/>
      <stop offset="46%" stop-color="#6f8290"/>
      <stop offset="72%" stop-color="#d3a98d"/>
      <stop offset="100%" stop-color="#edc7a5"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ba2a9"/>
      <stop offset="100%" stop-color="#425d68"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4746"/>
      <stop offset="100%" stop-color="#22282b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .05"/>
      </feComponentTransfer>
    </filter>
  </defs>

