<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1067" role="img" aria-labelledby="title desc">
  <title id="title">清晨的光落在窗台上</title>
  <desc id="desc">暖色晨光、窗帘与窗台上的绿植剪影。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8e9cf"/>
      <stop offset="55%" stop-color="#efc79c"/>
      <stop offset="100%" stop-color="#d99a72"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6e6" stop-opacity=".72"/>
      <stop offset="100%" stop-color="#eabf95" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f7efe2"/>
      <stop offset="100%" stop-color="#e3cdb2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .055"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="1067" fill="url(#sky)"/>
  <circle cx="1160" cy="280" r="190" fill="#fff3d8" opacity=".55" filter="url(#soft)"/>
  <circle cx="1160" cy="280" r="122" fill="#fff8e9" opacity=".88"/>

  <path d="M0 748c248-76 398-34 610 32 218 68 386 56 565-8 154-55 292-73 425-29v324H0Z" fill="#b57859" opacity=".26"/>
  <path d="M0 842c226-96 418-50 611 11 194 62 374 55 558-2 154-47 283-54 431-12v228H0Z" fill="#8b5c45" opacity=".2"/>

  <g opacity=".92">
    <rect x="118" y="88" width="1020" height="690" rx="10" fill="#6f5643" opacity=".2"/>
    <rect x="146" y="116" width="964" height="634" rx="4" fill="url(#glass)"/>
    <rect x="618" y="116" width="18" height="634" fill="#6f5643" opacity=".45"/>
    <rect x="146" y="420" width="964" height="16" fill="#6f5643" opacity=".38"/>
  </g>

  <path d="M112 54c84 44 133 156 107 276-18 84-8 193 42 286-112-23-178-95-195-193-25-145 5-287 46-369Z" fill="url(#curtain)" opacity=".94"/>
  <path d="M1142 30c-76 88-94 200-58 304 33 96 28 211-20 314 92-33 148-104 158-204 13-128-21-284-80-414Z" fill="url(#curtain)" opacity=".9"/>

  <g fill="#5b4133" opacity=".78">
    <path d="M282 786h178v20H282z"/>
    <path d="M314 708c0-72 62-119 138-119 8 0 16 1 23 3-31 24-48 58-48 101v15h-36v72h-32v-72h-45Z"/>
    <path d="M424 570c48 34 76 82 80 143-34-10-60-33-76-68-15 28-39 48-71 59 6-58 29-104 67-134Z"/>
    <path d="M398 559c-14-45-6-84 25-119 25 36 31 74 18 115Z"/>
    <path d="M462 588c29-33 64-45 105-37-8 42-34 70-78 84Z"/>
  </g>

  <g opacity=".38" fill="#7b563f">
    <ellipse cx="1010" cy="778" rx="118" ry="22"/>
    <path d="M946 778h128l-14 112h-100z"/>
    <path d="M966 665c0-34 22-57 48-57s48 23 48 57v91h-96z" opacity=".65"/>
  </g>

  <rect width="1600" height="1067" filter="url(#grain)" opacity=".8"/>
</svg>
