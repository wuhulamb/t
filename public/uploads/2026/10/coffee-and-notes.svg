<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1067" role="img" aria-labelledby="title desc">
  <title id="title">咖啡与手边笔记</title>
  <desc id="desc">俯视角度下的咖啡杯、摊开的笔记本和一株绿植。</desc>
  <defs>
    <linearGradient id="table" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9d9c2"/>
      <stop offset="100%" stop-color="#d3b997"/>
    </linearGradient>
    <radialGradient id="coffee" cx=".42" cy=".38" r=".7">
      <stop offset="0%" stop-color="#7b4a30"/>
      <stop offset="100%" stop-color="#3e2418"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .05"/>
      </feComponentTransfer>
    </filter>
  </defs>

